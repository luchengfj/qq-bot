# QQ 机器人通道插件配置
#
# 这是 Cordis patch 层：安装后会在 profile 中插入一个插件行，并把下面的
# `config` 作为该行的配置传给 index.js 的 apply(ctx, config)。
# 修改这里的配置后，需要重新启用插件（或重启 DSH）才会生效：
#   插件管理里把 qq-bot 关闭再打开，或直接重启 Harness。
#
# ★ 最简接入流程（扫码登录，无需手改 NapCat 配置）★
#   1. 启动 NapCat（已安装 QQNT），记下它终端里打印的 WebUI token
#   2. 把该 token 填到下面的 napcat.webuiToken
#   3. 关闭再启用本插件，浏览器打开 http://127.0.0.1:6700/setup
#   4. 点「获取二维码」用手机 QQ 扫码 → 点「一键接入」
#
# 手动接入方式：NapCatQQ / Lagrange.Core / LLOneBot 配置「反向 WebSocket」客户端
#   地址  ws://127.0.0.1:6700/onebot
#   （如果设置了 accessToken，加上 ?access_token=你的token 或 Authorization: Bearer）
#
- insert:
    - id: qq-bot
      name: '@local/qq-bot'
      config:
        # ---- OneBot 连接 ----
        host: '0.0.0.0'          # 监听地址；只在本机用可改 '127.0.0.1'
        port: 6700               # 监听端口
        path: /onebot            # WebSocket / HTTP POST 路径
        accessToken: ''          # 可选：接入令牌（留空则不校验）
        secret: ''               # 可选：HTTP POST 上报签名密钥（HMAC-SHA1）
        replyVia: ws             # 'ws' 通过同一 WebSocket 回复；'http' 走 httpApiBase
        httpApiBase: ''          # replyVia=http 或 WS 不可用时的 OneBot HTTP API 地址，如 http://127.0.0.1:3000
        httpApiToken: ''         # HTTP API 的 Bearer token（可选）
        replyAtSender: true      # 群消息回复时是否 @发送者
        maxImageBytes: 8388608   # 单张图片下载上限（默认 8MB）

        # ---- NapCat 扫码登录 / 一键接入（内置控制台）----
        # 启动插件后打开 http://127.0.0.1:6700/setup 即可扫码登录并一键接入。
        napcat:
          enabled: true              # false 则关闭内置控制台的 NapCat 联动
          baseUrl: 'http://127.0.0.1:6099'  # NapCat WebUI 地址
          webuiToken: ''             # ★ NapCat WebUI 登录令牌（NapCat 启动日志/终端里显示的那串 token）
          reverseHost: '127.0.0.1'   # 让 NapCat 连回本插件时用的地址
          reversePort: 6700          # 让 NapCat 连回本插件时用的端口
          timeoutMs: 15000
          # ---- 托管运行时：面板可自行下载并启动 NapCat ----
          napcatDir: ''              # 留空= ~/.dsh/integrations/dsh-qq/napcat
          webuiPort: 6099            # NapCat WebUI 端口（用于检测是否已启动）

        # ---- 触发规则 ----
        trigger:
          privateAlways: true    # 私聊消息是否全部响应
          groupRequiresAt: true  # 群消息是否需要 @机器人 或 前缀才响应
          prefix: ''             # 可选命令前缀，如 '/ai '；命中后从提示词中去除

        # ---- 白名单 / 黑名单（留空=不限制）----
        allow:
          groups: []             # 只响应这些群号，如 ['123456']；空=所有群
          users: []              # 只响应这些 QQ 号；空=所有人
          denyUsers: []          # 屏蔽这些 QQ 号

        # ---- 对话 / 视觉大模型 ----
        # mode: harness  = 直接用 Harness 里选好的模型，不需要任何密钥 ★默认★
        # mode: external = 走 OpenAI 兼容端点，需要填 apiKey
        llm:
          mode: harness           # 'harness'（推荐，免密钥）或 'external'
          # 下面三项只在 mode: harness 时生效，且都可以留空：
          # 留空 = 跟随 Harness 当前选择的模型；填写则强制指定。
          provider: ''            # 例：'deepseek'
          reasoningEffort: ''     # 例：'low' / 'medium' / 'high'（模型支持时）
          temperature: 0.4
          # 以下是 mode: external 才用到的 OpenAI 兼容端点配置
          # 默认用阿里云百炼 DashScope 的 OpenAI 兼容模式。
          # 任何 OpenAI 兼容端点都能用：OpenAI、DeepSeek、本地 vLLM/Ollama 等。
          baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
          apiKey: ''             # mode: external 时必填（本地无鉴权网关可留空）
          model: ''              # 模型名：mode: external 留空则默认 qwen-vl-max-latest；
                                 # mode: harness 请保持留空，否则会强制指定该模型
          systemPrompt: '你是 QQ 群里的智能助手，请用简洁、友好的中文回答用户的问题；当用户发来图片时，请描述图片并针对图片内容作答。'
          maxTokens: 1024
          timeoutMs: 60000
          # 单条回复的最大字数（0 = 不限制）。QQ 单条消息过长会被截断，
          # 建议 300~800。超出时会自动拆成多条发送（不再直接截断丢内容）。
          maxReplyChars: 600
          # 一条回复最多拆成几条发送（1 = 不拆分，直接截断）。
          maxReplyParts: 4
          # 图片 SSRF 防护：默认禁止下载内网 / 本机 / 云元数据地址的图片。
          # 只有当你的图片确实来自局域网（如自建图床）时才设为 true。
          allowPrivateImages: false

        # ---- 长期记忆（按会话记录，可持久化）----
        # 机器人会记住用户说过的关键信息（"我叫小明"、"我喜欢咖啡"），
        # 之后的对话会自然带上这些信息。私聊与群聊的记忆互相隔离。
        # 用户在 QQ 里发「我的记忆」可查看，发「忘记我」可清除。
        memory:
          enabled: true          # false 则完全关闭记忆功能
          maxFacts: 60           # 每个用户最多记住多少条
          maxFactChars: 120      # 单条记忆的最大长度
          maxReplies: 30         # 保留最近多少条回复（用于避免重复回答）
          # ---- 对话上下文（"刚才聊了什么"）----
          # 与上面的长期记忆不同：这是最近几轮的真实问答，让机器人能接住
          # "那它呢？"这类指代；静默一段时间后自动清空，不会被当成长期知识。
          maxHistory: 12         # 每个会话保留最近多少轮（0 = 关闭上下文）
          maxHistoryChars: 300   # 单轮内容最长记多少字
          historyTtlMinutes: 30  # 静默多少分钟就当作新话题
          ttlDays: 30            # 多久没说话就遗忘长期记忆（天）
          file: ''               # ★ 持久化文件路径；留空则只在内存里（重启即失效）
                                 # 例：file: 'C:/Users/你的用户名/.dsh/qq-bot-memory.json'
          autoSaveMs: 15000      # 有新记忆后多久写一次磁盘

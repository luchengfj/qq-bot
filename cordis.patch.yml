# @local/qq-bot — DeepSeek Harness 插件配置（「零下载」模式）
#
# 本插件不再下载 / 安装 / 启动 NapCat，也不再做扫码登录。
# 两种用法：
#   1. 面板「直聊测试」：不装任何东西，直接在 DSH 面板里发消息，验证收图、
#      答题、记忆、指令与分段回复（走 Harness 自带模型，无需 API key）。
#   2. 连接真实 QQ（可选）：插件作为 OneBot v11 客户端连到你已有的实现
#      （NapCat / Lagrange / LLOneBot / go-cqhttp 等）。
#      * 最省事：自动探测本机常见 OneBot 正向 WS 端口，找到就自动连上；
#      * 或者手填一个正向 WS 地址（forward.url / 面板「连接已有的 OneBot 端」）；
#      * 或者让实现端用反向 WS 连回 ws://127.0.0.1:6700/onebot。
# 硬约束：QQ 官方没有免客户端的 HTTP 机器人 API，所以要收发真实 QQ 消息，
# 仍需要一个已经装好并登录好的 OneBot 实现端——但本插件不会去下载它。
# 完全零 npm 依赖，只使用 Node 内置模块。

- insert:
    - id: qq-bot
      name: '@local/qq-bot'
      config:
        # ---- 插件自带的 OneBot 服务端（反向 WS / HTTP 上报） ----
        host: 0.0.0.0
        port: 6700
        path: /onebot
        accessToken: ''
        secret: ''
        replyVia: ws
        httpApiBase: ''
        httpApiToken: ''
        replyAtSender: true
        maxImageBytes: 8388608

        # ---- 正向 WS：插件主动连到已有的 OneBot 服务 ----
        # 留空即可；自动探测找到后会自动填入并连接。一旦这里或面板里有手填
        # 地址，自动探测就不会覆盖它。
        forward:
          enabled: false
          url: ''
          accessToken: ''
          reconnectMs: 5000

        # ---- 本机 OneBot 端口自动探测（最省事的连接方式） ----
        # 启动时立刻扫一轮，之后每 intervalMs 重扫；发现真实 OneBot 端且
        # 当前没有手填地址/连接时自动连上。插件自己的监听端口永远被排除。
        detect:
          enabled: true
          host: 127.0.0.1
          ports: [3001, 3000, 5700, 8080, 6099, 3333]
          paths: ['/', '/onebot']
          intervalMs: 20000
          timeoutMs: 1500
          accessToken: ''
          excludePorts: []

        # ---- 触发规则 ----
        trigger:
          privateAlways: true
          groupRequiresAt: true
          prefix: ''

        # ---- 白名单（留空 = 不限制） ----
        allow:
          groups: []
          users: []
          denyUsers: []

        # ---- 模型：默认用 Harness 自带模型，无需 key ----
        llm:
          mode: harness
          provider: ''
          reasoningEffort: ''
          temperature: 0.4
          baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
          apiKey: ''
          textOnlyFallbackOnVision: true
          model: ''
          systemPrompt: '你是 QQ 群里的智能助手，请用简洁、友好的中文回答用户的问题；当用户发来图片时，请描述图片并针对图片内容作答。'
          maxTokens: 1024
          timeoutMs: 60000
          allowPrivateImages: false
          maxReplyChars: 0
          maxReplyParts: 4

        # ---- 长期记忆 ----
        memory:
          enabled: true
          maxFacts: 60
          maxFactChars: 120
          maxReplies: 30
          maxHistory: 12
          maxHistoryChars: 300
          historyTtlMinutes: 30
          ttlDays: 30
          file: ''
          autoSaveMs: 15000
